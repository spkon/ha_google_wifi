name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '23 6 * * 1'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        ha: [minimum, latest]
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.14'
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
      - name: Install isolated test dependencies
        run: |
          python -m pip install -r requirements-dev.txt
          npm ci --ignore-scripts --no-audit --no-fund
      - name: Test current Home Assistant release
        if: matrix.ha == 'latest'
        run: python -m pip install --upgrade homeassistant home-assistant-frontend
      - name: Record tested framework versions
        run: python -m pip show homeassistant home-assistant-frontend
      - name: Check syntax, undefined names and imports
        run: python -m ruff check --select F,E9,I custom_components tests tools
      - name: Validate bundled HACS assets
        run: python tools/sync_frontend.py --check
      - name: Test integration and HA framework behaviour
        run: python -m pytest -q --cov --cov-report=term --cov-report=xml:coverage.xml --cov-report=json:coverage.json --cov-fail-under=90 --basetemp=test-runtime-ci
      - name: Test map, history and bundled panel
        run: npm test
      - name: Build manual installation archive
        run: python tools/build_package.py
      - name: Verify release contents
        run: python tools/validate_release.py
      - name: Save isolated coverage and scale evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: validation-${{ matrix.ha }}
          path: |
            coverage.xml
            coverage.json
            test-runtime-ci/**/scale-metrics.json
            dist/SHA256SUMS

  hassfest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: home-assistant/actions/hassfest@master

  hacs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: hacs/action@main
        with:
          category: integration
          comment: false

  dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.14'
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
      - run: python -m pip install pip-audit==2.10.1
      - name: Resolve and audit runtime dependencies
        run: |
          python -c "import json,pathlib; m=json.loads(pathlib.Path('custom_components/google_wifi_insights/manifest.json').read_text()); pathlib.Path('runtime-requirements.txt').write_text('\n'.join(m['requirements'])+'\n')"
          python -m pip_audit -r runtime-requirements.txt
      - name: Audit frontend development dependencies
        run: npm audit --audit-level=moderate
